name: Compose renderer

on:
  pull_request:
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npm run build
      - run: npm run android:runtime:build
      - run: git diff --exit-code -- packages/compose/src/main/assets/mcp-native-runtime.js
      - name: Compile, lint, and run JVM tests
        working-directory: packages/compose
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon
      - name: Run API 37 renderer and accessibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: "37.1"
          target: google_apis_ps16k
          emulator-build: 15917651
          arch: x86_64
          profile: pixel_6
          disk-size: 8G
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio
          disable-animations: true
          working-directory: packages/compose
          script: ./gradlew connectedDebugAndroidTest --no-daemon
