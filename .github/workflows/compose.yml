name: Compose renderer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - scripts/compose-maven-publication.mjs
      - scripts/smoke-compose-publication.mjs
      - tests/compose-maven-publication.test.mjs
      - tests/fixtures/compose-consumer/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - scripts/compose-maven-publication.mjs
      - scripts/smoke-compose-publication.mjs
      - tests/compose-maven-publication.test.mjs
      - tests/fixtures/compose-consumer/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm run build
      - run: npm run android:runtime:build
      - run: git diff --exit-code -- packages/compose/src/main/assets/mcp-native-runtime.js
      - name: Compile, lint, and run JVM tests
        working-directory: packages/compose
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon
      - name: Verify Maven publication and clean consumer
        run: npm run android:package:smoke
