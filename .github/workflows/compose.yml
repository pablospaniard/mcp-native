name: Compose renderer

on:
  pull_request:
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/compose.yml
      - packages/compose/**
      - packages/renderer-core/**
      - packages/a2ui/**
      - packages/core/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npm run build
      - run: npm run android:runtime:build
      - run: git diff --exit-code -- packages/compose/src/main/assets/mcp-native-runtime.js
      - name: Compile, lint, and run JVM tests
        working-directory: packages/compose
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon
      - name: Install the pinned API 37 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse0
          COMPOSE_SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${COMPOSE_SDKMANAGER}" --licenses >/dev/null || true
          "${COMPOSE_SDKMANAGER}" --install "platform-tools" "platforms;android-36" "system-images;android-37.1;google_apis_ps16k;x86_64"
          curl --fail --location --output "${RUNNER_TEMP}/emulator.zip" https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip
          unzip -oq "${RUNNER_TEMP}/emulator.zip" -d "${ANDROID_HOME}"
          "${ANDROID_HOME}/emulator/emulator" -version
      - name: Run API 37 renderer and accessibility tests
        working-directory: packages/compose
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/compose-avd
        run: |
          set -euo pipefail
          COMPOSE_ADB="${ANDROID_HOME}/platform-tools/adb"
          COMPOSE_AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          COMPOSE_EMULATOR="${ANDROID_HOME}/emulator/emulator"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${COMPOSE_AVDMANAGER}" create avd --force --name compose-api-37 --package "system-images;android-37.1;google_apis_ps16k;x86_64" --device pixel_6
          printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=8G\n' >> "${ANDROID_AVD_HOME}/compose-api-37.avd/config.ini"

          "${COMPOSE_EMULATOR}" -port 5554 -avd compose-api-37 -no-window -gpu swangle_indirect -no-snapshot -noaudio > "${RUNNER_TEMP}/compose-emulator.log" 2>&1 &
          COMPOSE_EMULATOR_PID=$!
          cleanup() {
            "${COMPOSE_ADB}" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            wait "${COMPOSE_EMULATOR_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          timeout 600 "${COMPOSE_ADB}" -s emulator-5554 wait-for-device
          COMPOSE_BOOTED=0
          for _ in $(seq 1 300); do
            if [[ "$("${COMPOSE_ADB}" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              COMPOSE_BOOTED=1
              break
            fi
            sleep 2
          done
          if [[ "${COMPOSE_BOOTED}" != "1" ]]; then
            tail -n 200 "${RUNNER_TEMP}/compose-emulator.log"
            exit 1
          fi

          COMPOSE_SERVICES_READY=0
          for _ in $(seq 1 60); do
            if "${COMPOSE_ADB}" -s emulator-5554 shell service check input 2>/dev/null | grep -q "found" && "${COMPOSE_ADB}" -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then
              COMPOSE_SERVICES_READY=1
              break
            fi
            sleep 2
          done
          if [[ "${COMPOSE_SERVICES_READY}" != "1" ]]; then
            tail -n 200 "${RUNNER_TEMP}/compose-emulator.log"
            exit 1
          fi
          COMPOSE_UNLOCKED=0
          for _ in $(seq 1 30); do
            if "${COMPOSE_ADB}" -s emulator-5554 shell input keyevent 82 >/dev/null 2>&1; then
              COMPOSE_UNLOCKED=1
              break
            fi
            sleep 2
          done
          if [[ "${COMPOSE_UNLOCKED}" != "1" ]]; then
            tail -n 200 "${RUNNER_TEMP}/compose-emulator.log"
            exit 1
          fi
          "${COMPOSE_ADB}" -s emulator-5554 shell settings put global window_animation_scale 0.0
          "${COMPOSE_ADB}" -s emulator-5554 shell settings put global transition_animation_scale 0.0
          "${COMPOSE_ADB}" -s emulator-5554 shell settings put global animator_duration_scale 0.0
          if ! ./gradlew connectedDebugAndroidTest --no-daemon; then
            "${COMPOSE_ADB}" -s emulator-5554 logcat -d -t 500 || true
            tail -n 200 "${RUNNER_TEMP}/compose-emulator.log" || true
            exit 1
          fi
