name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to resume
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pablospaniard/mcp-native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run release:verify
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Publish missing package versions
        env:
          # Manual recovery may temporarily use a granular token to bootstrap a new package.
          # Normal release events keep using trusted publishing through OIDC.
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.NPM_TOKEN || '' }}
        run: |
          publish_if_missing() {
            package_name="$1"
            package_path="$2"
            package_version="$(node -p "require('./${package_path}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
              return
            fi

            npm publish --workspace "${package_name}" --access public
          }

          publish_if_missing "@mcp-native/core" "packages/core"
          publish_if_missing "@mcp-native/mcp" "packages/mcp"
          publish_if_missing "@mcp-native/a2ui" "packages/a2ui"
          publish_if_missing "@mcp-native/webview" "packages/webview"
          publish_if_missing "@mcp-native/react-native" "packages/react-native"
          publish_if_missing "mcp-native" "packages/mcp-native"
