name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to resume
        required: true
        type: string
      maven_deployment_id:
        description: Existing Maven Central deployment ID to resume without rebuilding or publishing npm
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'pablospaniard/mcp-native' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${REQUESTED_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$ ]]; then
            echo "::error::Release tag must be an exact semantic version."
            exit 1
          fi

          release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REQUESTED_TAG}" --jq '.tag_name')"
          if [[ "${release_tag}" != "${REQUESTED_TAG}" ]]; then
            echo "::error::Resolved release tag does not match the requested tag."
            exit 1
          fi

          IFS=$'\t' read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )

          while [[ "${object_type}" == "tag" ]]; do
            IFS=$'\t' read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
          done

          if [[ "${object_type}" != "commit" || ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release tag does not resolve to an immutable commit."
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_tag#v}" >> "${GITHUB_OUTPUT}"
          echo "commit=${object_sha}" >> "${GITHUB_OUTPUT}"

  publish-npm:
    needs: resolve
    if: github.event_name != 'workflow_dispatch' || inputs.maven_deployment_id == ''
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out immutable release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
        working-directory: release
      - run: node ../automation/scripts/run-release-verification.mjs
        working-directory: release
        env:
          MCP_NATIVE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - name: Publish missing package versions
        working-directory: release
        run: node ../automation/scripts/publish-release.mjs

  build-compose:
    needs: resolve
    if: github.event_name != 'workflow_dispatch' || inputs.maven_deployment_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out immutable release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install pinned Android SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
      - run: npm ci
        working-directory: release
      - name: Verify Maven publication and clean consumer
        run: npm run android:package:smoke
        working-directory: release
      - name: Build unsigned release publication
        run: node ../automation/scripts/compose-maven-publication.mjs build
        working-directory: release
        env:
          MCP_NATIVE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - name: Transfer unsigned publication to trusted release job
        uses: actions/upload-artifact@v6
        with:
          name: compose-maven-publication-${{ needs.resolve.outputs.version }}
          path: release/packages/compose/library/build/maven-repository
          if-no-files-found: error
          retention-days: 7

  publish-compose:
    needs: [resolve, build-compose]
    if: github.event_name != 'workflow_dispatch' || inputs.maven_deployment_id == ''
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted release automation only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Download unsigned publication
        uses: actions/download-artifact@v7
        with:
          name: compose-maven-publication-${{ needs.resolve.outputs.version }}
          path: publication
      - name: Sign and publish Compose to Maven Central
        run: node scripts/compose-maven-publication.mjs publish
        working-directory: automation
        env:
          MCP_NATIVE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          MAVEN_PUBLICATION_REPOSITORY: ${{ github.workspace }}/publication
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

  resume-compose:
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && inputs.maven_deployment_id != ''
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted release automation only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Resume Maven Central deployment
        run: node scripts/compose-maven-publication.mjs publish
        working-directory: automation
        env:
          MCP_NATIVE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          MAVEN_CENTRAL_DEPLOYMENT_ID: ${{ inputs.maven_deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
