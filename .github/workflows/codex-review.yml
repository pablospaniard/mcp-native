name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional pull request number to gate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  codex-review-gate:
    name: codex-review
    if: >-
      ${{
        (github.event_name != 'schedule' || vars.CODEX_REVIEW_GATE_AUTO_RETRY != 'false') &&
        (github.event_name != 'pull_request_target' ||
          github.event.pull_request.draft == false) &&
        (github.event_name != 'pull_request_target' ||
          github.event.action != 'labeled' ||
          github.event.label.name == 'codex-review-approved') &&
        (github.event_name != 'pull_request_target' ||
          github.event.action != 'unlabeled' ||
          github.event.label.name == 'codex-review-approved') &&
        (github.event_name != 'pull_request_review' ||
          github.event.pull_request.draft == false) &&
        (github.event_name != 'pull_request_review_comment' ||
          github.event.pull_request.draft == false) &&
        (github.event_name != 'issue_comment' ||
          (github.event.issue.pull_request &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.comment.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.comment.user.login))))) &&
        (github.event_name != 'pull_request_review' ||
          (vars.CODEX_REVIEW_GATE_EVENT_MODE != 'comment-only' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.review.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.review.user.login))))) &&
        (github.event_name != 'pull_request_review_comment' ||
          ((vars.CODEX_REVIEW_GATE_EVENT_MODE == 'full' || vars.CODEX_REVIEW_GATE_EVENT_MODE == '') &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.comment.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.comment.user.login)))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out trusted authorization helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/codex-review-authorize.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require maintainer approval for external contributions
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: >-
            ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request || '' }}
          PR_EVENT_ACTION: ${{ github.event.action || '' }}
          REMOVED_LABEL_NAME: ${{ github.event.label.name || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const authorizePath = `${process.env.GITHUB_WORKSPACE}/scripts/codex-review-authorize.mjs`;
            let decideCodexReviewAuthorization;
            let APPROVAL_LABEL;
            let STATUS_CONTEXT;
            try {
              ({
                decideCodexReviewAuthorization,
                APPROVAL_LABEL,
                STATUS_CONTEXT,
              } = await import(authorizePath));
            } catch (error) {
              core.setFailed(
                `Trusted authorization helper missing at ${authorizePath}: ${error.message}`,
              );
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) {
              core.info('No pull request in event payload; skipping authorization.');
              core.setOutput('skip-gate', 'false');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const decision = decideCodexReviewAuthorization({
              draft: pullRequest.draft === true,
              authorAssociation: pullRequest.author_association,
              labelNames: pullRequest.labels.map((label) => label.name),
              eventAction: process.env.PR_EVENT_ACTION,
              removedLabelName:
                process.env.PR_EVENT_ACTION === 'unlabeled'
                  ? process.env.REMOVED_LABEL_NAME
                  : null,
            });

            core.setOutput('skip-gate', decision.skipGate ? 'true' : 'false');

            const statusUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (decision.removeApprovalLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: APPROVAL_LABEL,
              });
            }

            if (decision.status) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pullRequest.head.sha,
                state: decision.status.state,
                context: STATUS_CONTEXT,
                description: decision.status.description,
                target_url: statusUrl,
              });
            }

            if (decision.fail) {
              core.setFailed(decision.message || 'Codex review is not authorized.');
            }

      - name: Run Codex connector review gate
        if: >-
          steps.authorize.outcome == 'success' &&
          steps.authorize.outputs.skip-gate != 'true'
        uses: JoeyTeng/codex-review-gate-action@9e9f2377342805156afcb0724f501509ef4e444c # v1
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request }}
          status-context: codex-review
          event-mode: full
          codex-bot-logins: chatgpt-codex-connector,chatgpt-codex-connector[bot]
