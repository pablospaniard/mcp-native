name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional pull request number to gate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  codex-review-gate:
    name: codex-review
    if: >-
      ${{
        (github.event_name != 'schedule' || vars.CODEX_REVIEW_GATE_AUTO_RETRY != 'false') &&
        (github.event_name != 'pull_request_target' ||
          github.event.pull_request.draft == false) &&
        (github.event_name != 'pull_request_target' ||
          github.event.action != 'labeled' ||
          github.event.label.name == 'codex-review-approved') &&
        (github.event_name != 'pull_request_target' ||
          github.event.pull_request.user.login != 'dependabot[bot]') &&
        (github.event_name != 'issue_comment' ||
          github.event.issue.user.login != 'dependabot[bot]') &&
        (github.event_name != 'pull_request_review' ||
          github.event.pull_request.user.login != 'dependabot[bot]') &&
        (github.event_name != 'pull_request_review_comment' ||
          github.event.pull_request.user.login != 'dependabot[bot]') &&
        (github.event_name != 'issue_comment' ||
          (github.event.issue.pull_request &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.comment.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.comment.user.login))))) &&
        (github.event_name != 'pull_request_review' ||
          (vars.CODEX_REVIEW_GATE_EVENT_MODE != 'comment-only' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.review.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.review.user.login))))) &&
        (github.event_name != 'pull_request_review_comment' ||
          ((vars.CODEX_REVIEW_GATE_EVENT_MODE == 'full' || vars.CODEX_REVIEW_GATE_EVENT_MODE == '') &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            (contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(',{0},', github.event.comment.user.login)) ||
             contains(format(',chatgpt-codex-connector,chatgpt-codex-connector[bot],{0},',
              vars.CODEX_REVIEW_GATE_BOT_LOGINS), format(', {0},', github.event.comment.user.login)))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Require maintainer approval for external contributions
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: >-
            ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request || '' }}
          PR_EVENT_ACTION: ${{ github.event.action || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) {
              core.info('No pull request in event payload; skipping authorization.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.draft) {
              core.info('Draft pull request; skipping authorization.');
              return;
            }

            const trustedAssociations = new Set([
              'OWNER',
              'MEMBER',
              'COLLABORATOR',
            ]);
            if (trustedAssociations.has(pullRequest.author_association)) {
              return;
            }

            const approvalLabel = 'codex-review-approved';
            const approved = pullRequest.labels.some(
              (label) => label.name === approvalLabel,
            );
            const statusUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (process.env.PR_EVENT_ACTION === 'synchronize' && approved) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: approvalLabel,
              });
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pullRequest.head.sha,
                state: 'failure',
                context: 'codex-review',
                description: 'External approval invalidated by new push',
                target_url: statusUrl,
              });
              core.setFailed(
                'A new push invalidated the external-contributor review approval.',
              );
              return;
            }

            if (approved) {
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pullRequest.head.sha,
              state: 'failure',
              context: 'codex-review',
              description: 'Maintainer must add codex-review-approved',
              target_url: statusUrl,
            });
            core.setFailed(
              'A maintainer must add the codex-review-approved label before Codex reviews an external contribution.',
            );

      - name: Run Codex connector review gate
        if: steps.authorize.outcome == 'success'
        uses: JoeyTeng/codex-review-gate-action@9e9f2377342805156afcb0724f501509ef4e444c # v1
        with:
          github-token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request }}
          status-context: codex-review
          event-mode: full
          codex-bot-logins: chatgpt-codex-connector,chatgpt-codex-connector[bot]
