name: Native platform

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Pinned Android host build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 37 SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"
          "build-tools;37.0.0"
      - run: npm ci
      - name: Generate temporary host
        run: >-
          node scripts/prepare-native-host.mjs
          --react-native 0.86.0
          --output "${RUNNER_TEMP}/mcp-native-host-0.86.0"
      - name: Assemble debug application
        working-directory: ${{ runner.temp }}/mcp-native-host-0.86.0/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: android-rn-0.86.0
          path: ${{ runner.temp }}/mcp-native-host-0.86.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: Pinned iOS simulator host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Generate temporary host
        run: >-
          node scripts/prepare-native-host.mjs
          --react-native 0.86.0
          --output "${RUNNER_TEMP}/mcp-native-host-0.86.0"
      - name: Install CocoaPods dependencies
        working-directory: ${{ runner.temp }}/mcp-native-host-0.86.0/ios
        run: bundle install && bundle exec pod install
      - name: Build simulator application
        working-directory: ${{ runner.temp }}/mcp-native-host-0.86.0/ios
        run: >-
          xcodebuild
          -workspace McpNativeAccessibilityHost.xcworkspace
          -scheme McpNativeAccessibilityHost
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath "${RUNNER_TEMP}/mcp-native-ios-0.86.0"
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-rn-0.86.0
          path: ${{ runner.temp }}/mcp-native-ios-0.86.0/Build/Products/Debug-iphonesimulator/McpNativeAccessibilityHost.app
          if-no-files-found: error
