name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  native-host-bundle:
    name: Native host bundle (React Native ${{ matrix.react-native }}, ${{ matrix.js-engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-native: ["0.87.1", "0.86.0"]
        js-engine: ["hermes", "jsc"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Generate temporary host
        run: >-
          node scripts/prepare-native-host.mjs
          --react-native ${{ matrix.react-native }}
          --js-engine ${{ matrix.js-engine }}
          --output "${RUNNER_TEMP}/mcp-native-host-${{ matrix.react-native }}-${{ matrix.js-engine }}"
      - name: Bundle Android host
        working-directory: ${{ runner.temp }}/mcp-native-host-${{ matrix.react-native }}-${{ matrix.js-engine }}
        run: npm run mcp-native:bundle:android
      - name: Bundle iOS host
        working-directory: ${{ runner.temp }}/mcp-native-host-${{ matrix.react-native }}-${{ matrix.js-engine }}
        run: npm run mcp-native:bundle:ios
