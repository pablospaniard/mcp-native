name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:smoke

  expo-go-todolist:
    name: Expo Go todo proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo-go-todolist/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/expo-go-todolist
      - run: npm run check
        working-directory: examples/expo-go-todolist
      - run: npm run bundle:ios
        working-directory: examples/expo-go-todolist
      - run: npm run bundle:android
        working-directory: examples/expo-go-todolist

  expo-go-mixed-surfaces:
    name: Expo Go mixed-surface proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo-go-mixed-surfaces/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/expo-go-mixed-surfaces
      - run: npm run check
        working-directory: examples/expo-go-mixed-surfaces
      - run: npm run bundle:ios
        working-directory: examples/expo-go-mixed-surfaces
      - run: npm run bundle:android
        working-directory: examples/expo-go-mixed-surfaces

  native-host-bundle:
    name: Pinned native host bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Generate temporary host
        run: >-
          node scripts/prepare-native-host.mjs
          --react-native 0.86.0
          --output "${RUNNER_TEMP}/mcp-native-host-0.86.0"
      - name: Bundle Android host
        working-directory: ${{ runner.temp }}/mcp-native-host-0.86.0
        run: npm run mcp-native:bundle:android
      - name: Bundle iOS host
        working-directory: ${{ runner.temp }}/mcp-native-host-0.86.0
        run: npm run mcp-native:bundle:ios
