name: Feature proposal
description: Propose a focused capability or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Larger protocol, component, transport, and security-policy changes should begin as a proposal before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest public API and data flow that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility
      description: Explain trust boundaries, failure behavior, capability impact, and migration concerns.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this after the design is agreed.
          required: false
