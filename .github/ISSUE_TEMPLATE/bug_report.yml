name: Bug report
description: Report a reproducible problem in MCP Native
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or vulnerability details here; use the private process in SECURITY.md instead.
  - type: checkboxes
    attributes:
      label: Security check
      options:
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@mcp-native/core"
        - "@mcp-native/a2ui"
        - "@mcp-native/react-native"
        - "@mcp-native/webview"
        - "mcp-native"
        - "Monorepo / tooling"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe payload, code sample, or repository that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.0.2 or ae00598"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22, npm 11, macOS 15"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or related issues. Remove secrets and private data.
